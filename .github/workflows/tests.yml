name: Verify solution

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test]
        pip install pytest scipy
    - name: Install test dependencies
      run: |
        pip install -r requirements-test.txt
    - name: Install C++ build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libeigen3-dev
        pip install pybind11
    - name: Build C++ backend
      run: |
        mkdir -p cpp/build
        cd cpp/build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DPYTHON_EXECUTABLE=$(which python) -Dpybind11_DIR=$(python -m pybind11 --cmakedir)
        make -j$(nproc)
        cp _pyblockgrid_cpp*.so ../../src/pyBlockGrid/
    - name: Run unit tests
      run: |
        pytest tests/
